name: Build IGHelperApp APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'IGHelperApp.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app project
        run: unzip -q IGHelperApp.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: IGHelperApp
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGHelperApp-debug-apk
          path: IGHelperApp/app/build/outputs/apk/debug/*.apk
